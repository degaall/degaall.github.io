<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор мемов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        #memeCanvas {
            border: 1px solid black;
            margin-top: 20px;
        }
        input[type="text"] {
            width: 300px;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <h1>Генератор мемов</h1>
    
    <input type="file" id="imageUpload" accept="image/*">
    <br>
    <input type="text" id="topText" placeholder="Верхний текст">
    <br>
    <input type="text" id="bottomText" placeholder="Нижний текст">
    <br>
    <button onclick="generateMeme()">Создать мем</button>

    <canvas id="memeCanvas" class="hidden"></canvas>

    <script>
        function generateMeme() {
            const imgInput = document.getElementById('imageUpload');
            const topText = document.getElementById('topText').value.toUpperCase();
            const bottomText = document.getElementById('bottomText').value.toUpperCase();
            const canvas = document.getElementById('memeCanvas');
            const ctx = canvas.getContext('2d');

            if (imgInput.files && imgInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);

                        ctx.font = '40px Impact';
                        ctx.fillStyle = 'white';
                        ctx.strokeStyle = 'black';
                        ctx.lineWidth = 3;

                        // Верхний текст
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'top';
                        drawText(ctx, topText, canvas.width / 2, 10);

                        // Нижний текст
                        ctx.textBaseline = 'bottom';
                        drawText(ctx, bottomText, canvas.width / 2, canvas.height - 10);

                        canvas.classList.remove('hidden');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(imgInput.files[0]);
            } else {
                alert('Пожалуйста, выберите изображение.');
            }
        }

        function drawText(ctx, text, x, y) {
            const lines = text.split('|');
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                ctx.fillText(line, x, y + i * 50);
                ctx.strokeText(line, x, y + i * 50);
            }
        }
    </script>

</body>
</html>
