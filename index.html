<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Meme Generator Pro+</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/4.5.0/fabric.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --primary: #3b82f6;
            --surface: #f1f5f9;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --text: #f8fafc;
            --surface: #1e293b;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 1rem;
        }

        .editor-container {
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            gap: 1rem;
            height: 80vh;
        }

        .panel {
            background: var(--surface);
            padding: 1rem;
            border-radius: 12px;
            overflow-y: auto;
        }

        .meme-canvas {
            border: 2px dashed var(--surface);
            border-radius: 12px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            margin: 4px 0;
            cursor: pointer;
            width: 100%;
        }

        .template-thumbnail {
            width: 100%;
            border-radius: 8px;
            margin: 8px 0;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .template-thumbnail:hover {
            transform: scale(1.05);
        }

        .sticker-item {
            width: 80px;
            height: 80px;
            padding: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .sticker-item:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <!-- Шаблоны -->
        <div class="panel">
            <h3>🎭 Популярные шаблоны</h3>
            <div id="templates"></div>
        </div>

        <!-- Основной редактор -->
        <div class="meme-canvas">
            <canvas id="canvas"></canvas>
        </div>

        <!-- Стикеры -->
        <div class="panel">
            <h3>🌟 Стикеры</h3>
            <div id="stickers"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        let canvas = new fabric.Canvas('canvas', {
            width: 500,
            height: 500,
            backgroundColor: '#fff'
        });

        // Шаблоны мемов
        const templates = [
            {
                name: 'Драматург',
                url: 'https://i.imgur.com/abc123.jpg', // Замените на реальный URL
                textAreas: [
                    { top: 50, left: 50, fontSize: 40 },
                    { top: 400, left: 50, fontSize: 40 }
                ]
            },
            {
                name: 'Стивен Сигал',
                url: 'https://i.imgur.com/def456.jpg', // Замените на реальный URL
                textAreas: [
                    { top: 20, left: 50, fontSize: 35 }
                ]
            }
        ];

        // Коллекция стикеров
        const stickers = [
            '😎', '🤣', '💥', '👑', 
            '🔥', '💀', '❤️', '🎉'
        ];

        // Инициализация
        tg.expand();
        initTemplates();
        initStickers();

        function initTemplates() {
            const container = document.getElementById('templates');
            templates.forEach(template => {
                const img = document.createElement('img');
                img.className = 'template-thumbnail';
                img.src = template.url;
                img.onclick = () => loadTemplate(template);
                container.appendChild(img);
            });
        }

        function initStickers() {
            const container = document.getElementById('stickers');
            stickers.forEach(sticker => {
                const div = document.createElement('div');
                div.className = 'sticker-item';
                div.innerHTML = `
                    <div style="
                        font-size: 48px;
                        text-align: center;
                        user-select: none;
                    ">${sticker}</div>
                `;
                div.onclick = () => addSticker(sticker);
                container.appendChild(div);
            });
        }

        function loadTemplate(template) {
            fabric.Image.fromURL(template.url, img => {
                canvas.setBackgroundImage(img, () => {
                    canvas.renderAll();
                    template.textAreas.forEach(area => {
                        const text = new fabric.Textbox('Ваш текст', {
                            ...area,
                            width: 400,
                            fill: '#ffffff',
                            fontFamily: 'Impact',
                            stroke: '#000000',
                            strokeWidth: 2,
                            textAlign: 'center'
                        });
                        canvas.add(text);
                    });
                }, {
                    scaleX: canvas.width / img.width,
                    scaleY: canvas.height / img.height
                });
            });
        }

        function addSticker(sticker) {
            const text = new fabric.Text(sticker, {
                left: 100,
                top: 100,
                fontSize: 60,
                fill: '#ffd700',
                fontFamily: 'Arial',
                shadow: 'black 2px 2px 4px',
                padding: 10
            });
            
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        // Сохранение мема
        function saveMeme() {
            const dataURL = canvas.toDataURL({
                format: 'png',
                quality: 0.9
            });
            
            // Для Telegram
            tg.sendData(dataURL);
            tg.close();
        }

        // Темная тема
        if (tg.colorScheme === 'dark') {
            document.body.style.setProperty('--bg', '#0f172a');
            document.body.style.setProperty('--text', '#f8fafc');
        }

        // Кнопка сохранения
        tg.MainButton.setText("💾 Сохранить").onClick(saveMeme).show();
    </script>
</body>
</html>
