<!-- Добавьте это в раздел стилей -->
<style>
    .category-selector {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin: 20px 0;
    }
    
    .category-card {
        padding: 15px;
        border-radius: 10px;
        background: white;
        cursor: pointer;
        transition: transform 0.2s;
    }
    
    .category-card:hover {
        transform: scale(1.02);
    }
    
    .powerups {
        display: flex;
        gap: 10px;
        margin: 15px 0;
    }
    
    .powerup-btn {
        padding: 8px 15px;
        background: #2196F3;
        color: white;
        border-radius: 20px;
        cursor: pointer;
    }
</style>

<!-- Обновите тело приложения -->
<div class="container">
    <div id="lobby">
        <h2>Выберите категорию:</h2>
        <div class="category-selector" id="categories"></div>
        
        <h2>Создать комнату:</h2>
        <button onclick="createRoom()">🎮 Новая игра</button>
        
        <h2>Присоединиться:</h2>
        <input type="text" id="roomId" placeholder="ID комнаты">
        <button onclick="joinRoom()">🚪 Войти</button>
    </div>
    
    <div id="game" style="display: none;">
        <!-- Предыдущий интерфейс игры -->
    </div>
</div>

<script>
    // Новые константы
    const CATEGORIES = {
        9: 'Общие знания',
        17: 'Наука',
        22: 'География',
        23: 'История'
    };

    // Обновленная функция инициализации
    function initApp() {
        // Показываем выбор категории
        document.getElementById('categories').innerHTML = Object.entries(CATEGORIES)
            .map(([id, name]) => `
                <div class="category-card" onclick="selectCategory(${id})">
                    ${name}
                </div>
            `).join('');
    }

    // Выбор категории
    let selectedCategory = 9;
    function selectCategory(categoryId) {
        selectedCategory = categoryId;
        document.querySelectorAll('.category-card').forEach(card => {
            card.style.background = categoryId === Number(card.dataset.category) 
                ? '#e3f2fd' : 'white';
        });
    }

    // Создание комнаты
    async function createRoom() {
        const roomId = Math.random().toString(36).substr(2, 6).toUpperCase();
        await firebase.database().ref(`rooms/${roomId}`).set({
            category: selectedCategory,
            players: {},
            status: 'waiting'
        });
        tg.showAlert(`Комната создана! ID: ${roomId}`);
        joinRoom(roomId);
    }

    // Присоединение к комнате
    async function joinRoom(roomId = document.getElementById('roomId').value) {
        const roomRef = firebase.database().ref(`rooms/${roomId}`);
        const snapshot = await roomRef.once('value');
        
        if(snapshot.exists()) {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            loadQuestions(snapshot.val().category);
        } else {
            tg.showAlert('Комната не найдена!');
        }
    }

    // Система power-ups
    let powerups = {
        extraTime: 2,
        doublePoints: 1
    };

    function usePowerup(type) {
        if(powerups[type] > 0) {
            powerups[type]--;
            switch(type) {
                case 'extraTime':
                    // Логика добавления времени
                    break;
                case 'doublePoints':
                    // Логика удвоения очков
                    break;
            }
        }
    }

    // Инициализируем при запуске
    initApp();
</script>
