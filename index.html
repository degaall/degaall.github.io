<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Meme Generator Pro+</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/4.5.0/fabric.min.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --text: #1a1a1a;
            --primary: #3b82f6;
            --surface: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --text: #f8fafc;
            --surface: #1e293b;
            --shadow: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
        }

        .meme-canvas {
            background: var(--surface);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 10px var(--shadow);
            display: flex;
            justify-content: center;
            width: 100%;
        }

        canvas {
            border-radius: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .panel {
            background: var(--surface);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 10px var(--shadow);
            margin-top: 12px;
            width: 100%;
            max-width: 500px;
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding-bottom: 10px;
        }

        .panel h3 {
            width: 100%;
            text-align: center;
            margin-bottom: 8px;
        }

        .template-thumbnail,
        .sticker-item {
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .template-thumbnail {
            width: 80px;
        }

        .template-thumbnail:hover,
        .sticker-item:hover {
            transform: scale(1.05);
        }

        .sticker-item {
            font-size: 36px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            box-shadow: 0 2px 5px var(--shadow);
        }

        .save-button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 10px var(--shadow);
        }

        .save-button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <div class="meme-canvas">
            <canvas id="canvas"></canvas>
        </div>

        <div class="panel">
            <h3>🎭 Шаблоны</h3>
            <div id="templates" style="display: flex; gap: 10px;"></div>
        </div>

        <div class="panel">
            <h3>🌟 Стикеры</h3>
            <div id="stickers" style="display: flex; gap: 10px;"></div>
        </div>

        <button class="save-button" onclick="saveMeme()">💾 Сохранить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        let canvas = new fabric.Canvas('canvas', {
            width: 400,
            height: 400,
            backgroundColor: '#fff'
        });

        const templates = [
            { name: 'Драматург', url: 'https://i.imgur.com/abc123.jpg', textAreas: [{ top: 50, left: 50, fontSize: 30 }] },
            { name: 'Стивен Сигал', url: 'https://i.imgur.com/def456.jpg', textAreas: [{ top: 20, left: 50, fontSize: 25 }] }
        ];

        const stickers = ['😎', '🤣', '💥', '👑', '🔥', '💀', '❤️', '🎉'];

        tg.expand();
        initTemplates();
        initStickers();

        function initTemplates() {
            const container = document.getElementById('templates');
            templates.forEach(template => {
                const img = document.createElement('img');
                img.className = 'template-thumbnail';
                img.src = template.url;
                img.onclick = () => loadTemplate(template);
                container.appendChild(img);
            });
        }

        function initStickers() {
            const container = document.getElementById('stickers');
            stickers.forEach(sticker => {
                const div = document.createElement('div');
                div.className = 'sticker-item';
                div.innerHTML = sticker;
                div.onclick = () => addSticker(sticker);
                container.appendChild(div);
            });
        }

        function loadTemplate(template) {
            fabric.Image.fromURL(template.url, img => {
                canvas.setBackgroundImage(img, () => {
                    canvas.renderAll();
                    template.textAreas.forEach(area => {
                        const text = new fabric.Textbox('Ваш текст', {
                            ...area,
                            width: 300,
                            fill: '#ffffff',
                            fontFamily: 'Impact',
                            stroke: '#000000',
                            strokeWidth: 2,
                            textAlign: 'center'
                        });
                        canvas.add(text);
                    });
                }, {
                    scaleX: canvas.width / img.width,
                    scaleY: canvas.height / img.height
                });
            });
        }

        function addSticker(sticker) {
            const text = new fabric.Text(sticker, {
                left: 100,
                top: 100,
                fontSize: 50,
                fill: '#ffd700',
                fontFamily: 'Arial',
                shadow: 'black 2px 2px 4px'
            });
            canvas.add(text);
        }

        function saveMeme() {
            const dataURL = canvas.toDataURL('image/png');
            tg.sendData(dataURL);
            tg.close();
        }

        if (tg.colorScheme === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }
    </script>
</body>
</html>
