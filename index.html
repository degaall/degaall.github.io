<!DOCTYPE html>
<html>
<head>
    <title>Enhanced Jump Game</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #87CEEB;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            width: 360px;
            height: 640px;
            background: url('https://i.imgur.com/8xXvW0S.png'); /* Background image */
            background-size: cover;
            position: relative;
            border: 2px solid #333;
            overflow: hidden;
        }

        #player {
            width: 40px;
            height: 40px;
            background: url('https://i.imgur.com/5zK9y8r.png'); /* Player sprite */
            background-size: cover;
            position: absolute;
            left: 160px;
            bottom: 20px;
            transition: bottom 0.3s ease, left 0.1s ease;
        }

        .platform {
            width: 100px;
            height: 20px;
            background: url('https://i.imgur.com/Q9vXz8M.png'); /* Platform sprite */
            background-size: cover;
            position: absolute;
            animation: movePlatform var(--speed) linear infinite;
        }

        @keyframes movePlatform {
            0% { transform: translateY(-640px); }
            100% { transform: translateY(640px); }
        }

        .jumping {
            bottom: 220px;
        }

        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            text-align: center;
            display: none;
            border-radius: 10px;
        }

        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #4CAF50;
            border: none;
            color: white;
            border-radius: 5px;
        }

        #restart-btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="player"></div>
        <div id="score">Score: 0</div>
        <div id="game-over">
            <h2>Game Over</h2>
            <p id="final-score">Score: 0</p>
            <button id="restart-btn">Restart</button>
        </div>
    </div>

    <audio id="jump-sound" src="https://www.myinstants.com/media/sounds/mario-jump.mp3"></audio>
    <audio id="game-over-sound" src="https://www.myinstants.com/media/sounds/game-over.mp3"></audio>

    <script>
        const player = document.getElementById('player');
        const gameContainer = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const jumpSound = document.getElementById('jump-sound');
        const gameOverSound = document.getElementById('game-over-sound');

        let isJumping = false;
        let score = 0;
        let gameActive = true;
        let playerPos = { x: 160, y: 20 };
        let speed = 3; // Initial platform speed in seconds
        let platforms = [];

        // Telegram Web App integration
        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.expand();
            window.Telegram.WebApp.ready();
        }

        // Create initial platforms
        function createPlatform(y) {
            const platform = document.createElement('div');
            platform.classList.add('platform');
            platform.style.left = `${Math.random() * (360 - 100)}px`;
            platform.style.bottom = `${y}px`;
            platform.style.setProperty('--speed', `${speed}s`);
            platform.counted = false;
            gameContainer.appendChild(platform);
            platforms.push(platform);
        }

        for (let i = 0; i < 5; i++) {
            createPlatform(i * 150);
        }

        // Controls
        document.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            if (e.code === 'Space' && !isJumping) jump();
            if (e.code === 'ArrowLeft') moveLeft();
            if (e.code === 'ArrowRight') moveRight();
        });

        document.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            const touchX = e.touches[0].clientX;
            if (touchX < window.innerWidth / 3) moveLeft();
            else if (touchX > window.innerWidth * 2 / 3) moveRight();
            else if (!isJumping) jump();
        });

        function jump() {
            isJumping = true;
            player.classList.add('jumping');
            jumpSound.play();
            setTimeout(() => {
                player.classList.remove('jumping');
                isJumping = false;
            }, 600);
        }

        function moveLeft() {
            if (playerPos.x > 0) {
                playerPos.x -= 20;
                player.style.left = `${playerPos.x}px`;
            }
        }

        function moveRight() {
            if (playerPos.x < 320) {
                playerPos.x += 20;
                player.style.left = `${playerPos.x}px`;
            }
        }

        // Game loop
        function gameLoop() {
            if (!gameActive) return;

            const playerRect = player.getBoundingClientRect();
            let onPlatform = false;

            platforms.forEach((platform, index) => {
                const platRect = platform.getBoundingClientRect();

                // Collision detection
                if (
                    playerRect.bottom <= platRect.top + 5 &&
                    playerRect.top >= platRect.top - 5 &&
                    playerRect.right > platRect.left &&
                    playerRect.left < platRect.right &&
                    !isJumping
                ) {
                    onPlatform = true;
                    playerPos.y = platRect.top - playerRect.height;
                    player.style.bottom = `${playerPos.y}px`;
                }

                // Platform passed
                if (platRect.top > 640 && !platform.counted) {
                    score += 10;
                    scoreDisplay.textContent = `Score: ${score}`;
                    platform.counted = true;
                }

                // Recycle platform
                if (platRect.top > 640) {
                    platform.style.bottom = '-20px';
                    platform.style.left = `${Math.random() * (360 - 100)}px`;
                    platform.counted = false;
                }
            });

            // Fall if not on platform
            if (!onPlatform && !isJumping && playerPos.y > 20) {
                playerPos.y -= 5;
                player.style.bottom = `${playerPos.y}px`;
            }

            // Game over
            if (playerPos.y < -40) {
                endGame();
            }

            // Increase difficulty
            if (score % 50 === 0 && score > 0 && speed > 1.5) {
                speed -= 0.2;
                platforms.forEach(p => p.style.setProperty('--speed', `${speed}s`));
            }

            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameActive = false;
            gameOverSound.play();
            gameOverScreen.style.display = 'block';
            finalScoreDisplay.textContent = `Score: ${score}`;
            platforms.forEach(p => p.style.animationPlayState = 'paused');
        }

        function restartGame() {
            gameActive = true;
            score = 0;
            speed = 3;
            playerPos = { x: 160, y: 20 };
            player.style.left = '160px';
            player.style.bottom = '20px';
            scoreDisplay.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'none';
            platforms.forEach(p => gameContainer.removeChild(p));
            platforms = [];
            for (let i = 0; i < 5; i++) {
                createPlatform(i * 150);
            }
            gameLoop();
        }

        restartBtn.addEventListener('click', restartGame);

        // Start game
        gameLoop();
    </script>
</body>
</html>
