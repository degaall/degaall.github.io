<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Meme Generator Pro+</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/4.5.0/fabric.min.js"></script>
    <style>
        :root {
            --bg: #f9fafb;
            --text: #1a1a1a;
            --primary: #3b82f6;
            --surface: rgba(255, 255, 255, 0.9);
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg: #121826;
            --text: #f8fafc;
            --surface: rgba(30, 41, 59, 0.9);
            --shadow: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: all 0.3s ease-in-out;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
        }

        .meme-canvas {
            background: var(--surface);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 10px var(--shadow);
            width: 100%;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            border-radius: 10px;
            background: white;
        }

        .button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 10px var(--shadow);
            transition: transform 0.2s;
        }

        .button:hover {
            background: #2563eb;
            transform: scale(1.05);
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <div class="meme-canvas">
            <canvas id="canvas"></canvas>
        </div>

        <label class="button">
            📤 Загрузить изображение
            <input type="file" id="uploadImage" accept="image/*">
        </label>
        <button class="button" onclick="saveMeme()">💾 Сохранить в Telegram</button>
        <button class="button" onclick="downloadMeme()">📥 Скачать</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        let canvas = new fabric.Canvas('canvas', {
            width: 400,
            height: 400,
            backgroundColor: '#fff'
        });

        tg.expand(); // Разворачиваем WebApp

        // Загрузка изображения
        document.getElementById('uploadImage').addEventListener('change', event => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    fabric.Image.fromURL(e.target.result, img => {
                        const scaleX = canvas.width / img.width;
                        const scaleY = canvas.height / img.height;
                        img.scaleX = scaleX;
                        img.scaleY = scaleY;
                        
                        canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                            scaleX: scaleX,
                            scaleY: scaleY
                        });
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        // Функция сохранения мема в Telegram
        function saveMeme() {
            tg.sendData(canvas.toDataURL('image/png'));
            tg.close();
        }

        // Функция скачивания мема
        function downloadMeme() {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'meme.png';
            link.click();
        }

        // Автоустановка тёмной темы в Telegram
        if (tg.colorScheme === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }
    </script>
</body>
</html>
