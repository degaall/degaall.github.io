<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Telegram Дурак</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        /* Стили */
        body {
            font-family: Arial, sans-serif;
            background: #2e7d32;
            margin: 0;
            padding: 10px;
            color: white;
            user-select: none;
        }

        .game-container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .card {
            width: 60px;
            height: 90px;
            background: white;
            border-radius: 5px;
            border: 2px solid #fff;
            display: inline-flex;
            margin: 5px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            justify-content: center;
            align-items: center;
        }

        .card-value {
            font-size: 18px;
            font-weight: bold;
            position: absolute;
        }

        .top { top: 5px; }
        .bottom { bottom: 5px; transform: rotate(180deg); }

        .red { color: #d32f2f; }
        .black { color: #212121; }

        .game-status {
            text-align: center;
            padding: 10px;
            font-size: 18px;
        }

        .trump-card {
            position: fixed;
            top: 10px;
            right: 10px;
            transform: rotate(90deg);
        }

        /* Анимации */
        @keyframes deal {
            0% { transform: scale(0) rotate(180deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        @keyframes pulse {
            50% { transform: translateY(-10px); }
        }

        .deal-animation {
            animation: deal 0.5s ease-out;
        }

        .pulse-animation {
            animation: pulse 0.5s ease infinite;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="trump-card" id="trumpCard"></div>
        <div class="game-status" id="status">Загрузка игры...</div>
        <div id="table" style="height: 120px; border: 2px dashed #fff; margin: 10px 0;"></div>
        <div id="opponentHand"></div>
        <div style="text-align: center; margin: 20px 0;">
            <button id="moveBtn" style="display: none;">Ходить</button>
            <button id="takeBtn" style="display: none;">Взять</button>
        </div>
        <div id="playerHand"></div>
    </div>

    <script>
        // Инициализация Firebase (ЗАМЕНИТЕ НА СВОИ ДАННЫЕ)
        const firebaseConfig = {
            apiKey: "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA",
            authDomain: "your-project.firebaseapp.com",
            databaseURL: "https://your-project.firebaseio.com",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com"
        };
        firebase.initializeApp(firebaseConfig);

        // Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.hide();

        // Игровые константы
        const SUITS = ['♠', '♣', '♥', '♦'];
        const VALUES = ['6', '7', '8', '9', '10', 'J', 'Q', 'K', 'A'];

        class Game {
            constructor(roomId) {
                this.roomId = roomId;
                this.ref = firebase.database().ref(`rooms/${roomId}`);
                this.state = {
                    players: {},
                    table: [],
                    deck: [],
                    trump: null,
                    status: 'waiting',
                    currentPlayer: null
                };
                
                this.init();
            }

            async init() {
                if(this.roomId) {
                    this.ref.on('value', snapshot => this.updateState(snapshot.val()));
                } else {
                    this.setupNewGame();
                }
            }

            setupNewGame() {
                // Инициализация новой игры
                this.state.deck = this.createDeck();
                this.shuffleDeck();
                this.state.trump = this.state.deck[0].suit;
                this.state.players[tg.initDataUnsafe.user.id] = {
                    cards: this.state.deck.splice(0, 6),
                    status: 'waiting'
                };
            }

            createDeck() {
                return SUITS.flatMap(suit => 
                    VALUES.map(value => ({
                        suit,
                        value,
                        color: ['♥', '♦'].includes(suit) ? 'red' : 'black',
                        rank: VALUES.indexOf(value)
                    }))
                );
            }

            shuffleDeck() {
                for(let i = this.state.deck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.state.deck[i], this.state.deck[j]] = [this.state.deck[j], this.state.deck[i]];
                }
            }

            updateState(newState) {
                if(newState) {
                    this.state = newState;
                    this.render();
                }
            }

            render() {
                // Отрисовка интерфейса
                this.renderTrumpCard();
                this.renderHands();
                this.updateStatus();
            }

            renderTrumpCard() {
                const trumpCard = this.state.deck[0];
                document.getElementById('trumpCard').innerHTML = `
                    <div class="card ${trumpCard.color}">
                        <div class="card-value top">${trumpCard.value}${trumpCard.suit}</div>
                        <div class="card-value bottom">${trumpCard.value}${trumpCard.suit}</div>
                    </div>
                `;
            }

            renderHands() {
                // Отрисовка карт игрока
                const playerHandDiv = document.getElementById('playerHand');
                playerHandDiv.innerHTML = '';
                this.getCurrentPlayer().cards.forEach(card => {
                    const cardEl = this.createCardElement(card);
                    cardEl.onclick = () => this.selectCard(card);
                    playerHandDiv.appendChild(cardEl);
                });
            }

            createCardElement(card) {
                const div = document.createElement('div');
                div.className = `card ${card.color} deal-animation`;
                div.innerHTML = `
                    <div class="card-value top">${card.value}${card.suit}</div>
                    <div class="card-value bottom">${card.value}${card.suit}</div>
                `;
                return div;
            }

            selectCard(card) {
                // Логика выбора карты
                if(this.isCurrentPlayerTurn()) {
                    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
                    event.target.classList.add('selected');
                    document.getElementById('moveBtn').style.display = 'inline-block';
                }
            }

            async makeMove() {
                // Ход игрока
                const selectedCard = document.querySelector('.selected');
                if(selectedCard) {
                    this.state.table.push(this.getSelectedCard());
                    await this.ref.update({
                        table: this.state.table,
                        currentPlayer: this.getOpponentId()
                    });
                    this.updateRatings();
                }
            }

            getSelectedCard() {
                // Получение выбранной карты
                const selected = document.querySelector('.selected');
                return this.getCurrentPlayer().cards.find(c => 
                    c.value + c.suit === selected.innerText.replace(/\n/g, '')
                );
            }

            updateStatus() {
                let status = '';
                if(this.state.status === 'waiting') {
                    status = 'Ожидание игроков...';
                } else if(this.isCurrentPlayerTurn()) {
                    status = 'Ваш ход!';
                } else {
                    status = 'Ход противника';
                }
                document.getElementById('status').textContent = status;
            }

            isCurrentPlayerTurn() {
                return this.state.currentPlayer === tg.initDataUnsafe.user.id;
            }

            getCurrentPlayer() {
                return this.state.players[tg.initDataUnsafe.user.id];
            }

            getOpponentId() {
                return Object.keys(this.state.players).find(id => id !== tg.initDataUnsafe.user.id);
            }

            async updateRatings() {
                if(this.state.status === 'finished') {
                    await firebase.database().ref(`users/${tg.initDataUnsafe.user.id}/rating`)
                        .transaction(r => (r || 0) + 10);
                }
            }
        }

        // Инициализация игры
        const urlParams = new URLSearchParams(window.location.search);
        const startParam = urlParams.get('startapp');
        const roomId = startParam ? startParam.split('_')[1] : null;
        
        let game;
        if(roomId) {
            game = new Game(roomId);
        } else {
            game = new Game(`room_${Date.now()}`);
            tg.showAlert(`Комната создана: ${game.roomId}`);
        }

        // Обработчики кнопок
        document.getElementById('moveBtn').onclick = () => game.makeMove();
        document.getElementById('takeBtn').onclick = () => game.takeCards();

        // Интеграция с Telegram
        tg.MainButton.setText("Обновить игру").show();
        Telegram.WebApp.onEvent('mainButtonClicked', () => game.render());

        // Адаптация под тему Telegram
        if(tg.colorScheme === 'dark') {
            document.body.style.backgroundColor = '#1b5e20';
        }
    </script>
</body>
</html>
