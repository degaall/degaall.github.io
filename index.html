<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Meme Generator Pro+</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/4.5.0/fabric.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --primary: #3b82f6;
            --surface: #f1f5f9;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --text: #f8fafc;
            --surface: #1e293b;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 1rem;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .canvas-container {
            width: 100%;
            max-width: 350px;
            background: var(--surface);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 90%;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        input {
            display: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-container">
            <canvas id="canvas" width="300" height="300"></canvas>
        </div>

        <input type="file" id="uploadImage" accept="image/*">
        <button onclick="document.getElementById('uploadImage').click()">📤 Загрузить изображение</button>
        <button onclick="saveMeme()">💾 Сохранить в Telegram</button>
        <button onclick="downloadMeme()">📩 Скачать</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Инициализация Canvas
        let canvas = new fabric.Canvas('canvas');

        // Функция загрузки изображения
        document.getElementById('uploadImage').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                fabric.Image.fromURL(e.target.result, function(img) {
                    img.scaleToWidth(canvas.width);
                    canvas.clear();
                    canvas.add(img);
                    canvas.renderAll();
                });
            };
            reader.readAsDataURL(file);
        });

        // Сохранение изображения
        function saveMeme() {
            const dataURL = canvas.toDataURL({
                format: 'png',
                quality: 0.9
            });
            tg.sendData(dataURL);
            tg.close();
        }

        // Скачивание изображения
        function downloadMeme() {
            const dataURL = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'meme.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Темная тема
        if (tg.colorScheme === 'dark') {
            document.documentElement.setAttribute("data-theme", "dark");
        }
    </script>
</body>
</html>
