<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Super Mood App</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root {
            --primary-bg: #f0f2f5;
            --primary-text: #000;
            --button-hover: rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --primary-bg: #1a1a1a;
            --primary-text: #fff;
            --button-hover: rgba(255,255,255,0.1);
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: var(--primary-bg);
            color: var(--primary-text);
            margin: 0;
            transition: all 0.3s;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .mood-btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mood-btn:hover {
            transform: scale(0.98);
            filter: brightness(90%);
        }

        #result {
            padding: 20px;
            background: var(--button-hover);
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .emoji-animation {
            font-size: 2em;
            margin: 15px 0;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .lang-switcher {
            position: fixed;
            top: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-switcher">
            <button onclick="changeLanguage('ru')">🇷🇺</button>
            <button onclick="changeLanguage('en')">🇬🇧</button>
        </div>
        
        <h1 data-i18n="title">Как твое настроение? 😊</h1>
        
        <!-- Кнопки настроения -->
        <button class="mood-btn" style="background: #4CAF50;" 
                onclick="setMood('Отличное! 😄', 3)" 
                data-i18n="mood3">⭐️⭐️⭐️ Отличное</button>
        <button class="mood-btn" style="background: #FFC107;" 
                onclick="setMood('Нормальное 🙂', 2)" 
                data-i18n="mood2">⭐️⭐️ Нормальное</button>
        <button class="mood-btn" style="background: #F44336;" 
                onclick="setMood('Плохое 😞', 1)" 
                data-i18n="mood1">⭐️ Плохое</button>

        <!-- Мини-игра -->
        <div id="game" style="margin-top: 30px; display: none;">
            <h3 data-i18n="gameTitle">Поймай смайлик!</h3>
            <div id="gameArea" style="height: 100px; border: 2px dashed; position: relative;">
                <div id="target" style="position: absolute; font-size: 24px;">🎯</div>
            </div>
        </div>

        <div id="result"></div>
        
        <!-- Кнопка оплаты -->
        <button id="donateBtn" class="mood-btn" style="background: #2196F3; display: none;" 
                onclick="initPayment()" data-i18n="donate">Поддержать разработчика 💰</button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.setText("Отправить результат").hide();

        // Конфиг Firebase (замените на свой!)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID"
        };
        firebase.initializeApp(firebaseConfig);

        let currentMood = null;
        const emojiMap = {1: '😭', 2: '😐', 3: '🤩'};
        let currentLang = 'ru';

        // Инициализация темы
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.setAttribute('data-theme', 'dark');
        }

        // Локализация
        const translations = {
            ru: {
                title: "Как твое настроение? 😊",
                mood3: "⭐️⭐️⭐️ Отличное",
                mood2: "⭐️⭐️ Нормальное",
                mood1: "⭐️ Плохое",
                gameTitle: "Поймай смайлик!",
                donate: "Поддержать разработчика 💰"
            },
            en: {
                title: "How are you feeling? 😊",
                mood3: "⭐️⭐️⭐️ Awesome",
                mood2: "⭐️⭐️ Normal",
                mood1: "⭐️ Bad",
                gameTitle: "Catch the emoji!",
                donate: "Support developer 💰"
            }
        };

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = translations[lang][key];
            });
        }

        function setMood(text, score) {
            // Вибрация
            if (navigator.vibrate) navigator.vibrate(50);
            
            currentMood = {text, score};
            const result = document.getElementById('result');
            
            // Показать игру и кнопку доната
            document.getElementById('game').style.display = 'block';
            document.getElementById('donateBtn').style.display = 'block';
            initGame();

            // Сохранение в Firebase
            const userId = tg.initDataUnsafe.user?.id || 'anonymous';
            firebase.database().ref('moods/' + userId).push({
                mood: score,
                timestamp: Date.now()
            });

            result.style.display = 'block';
            result.innerHTML = `
                <h2>${text}</h2>
                <div class="emoji-animation">${emojiMap[score].repeat(score)}</div>
                <small>User ID: ${userId}</small>
            `;
            
            tg.MainButton.show();
        }

        // Мини-игра
        function initGame() {
            const target = document.getElementById('target');
            let position = 0;
            let direction = 1;

            const move = () => {
                position += direction * 5;
                if (position > 150 || position < 0) direction *= -1;
                target.style.left = position + 'px';
                requestAnimationFrame(move);
            };
            move();
        }

        // Инициализация платежей
        function initPayment() {
            tg.showInvoice({
                title: "Поддержка разработчика",
                description: "Спасибо за вашу поддержку!",
                currency: "USD",
                prices: [{ label: "Донат", amount: "100" }]
            });
        }

        // Обработчики Telegram
        Telegram.WebApp.onEvent('mainButtonClicked', () => {
            tg.sendData(JSON.stringify(currentMood));
            tg.close();
        });

        Telegram.WebApp.onEvent('invoiceClosed', (event) => {
            if (event.status === 'paid') {
                alert('Спасибо за поддержку! 💖');
            }
        });

        if (tg.platform !== 'unknown') {
            tg.BackButton.show();
            tg.onEvent('backButtonClicked', () => tg.close());
        }

        // Инициализация языка
        changeLanguage('ru'); 
    </script>
</body>
</html>
